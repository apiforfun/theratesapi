<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Rates API: free exchange rates API{% endblock %}</title>
  <meta name="description" content="{% block description %}Free foreign exchange rates API with current and historical European Central Bank reference rates since 1999. No API key.{% endblock %}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css?v={{ assetVersion }}">
  <script>document.documentElement.className = 'js'</script>
  <script defer src="/js/highlight.js?v={{ assetVersion }}"></script>
  <script defer src="/js/site.js?v={{ assetVersion }}"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h15M14 4l4 4-4 4M21 16H6M10 12l-4 4 4 4"/></svg>
      <span>The <b>Rates</b> API</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <a href="/documentation/"{% if active == 'docs' %} aria-current="page"{% endif %}>Docs</a>
      <a href="https://github.com/apiforfun/theratesapi">GitHub</a>
      <a href="mailto:apiforfun2@gmail.com">Contact</a>
    </nav>
  </div>
</header>
<main id="main">
{% block container %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <p>Data: <a href="https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html">European Central Bank</a></p>
    <nav aria-label="Footer">
      <a href="/documentation/">Docs</a>
      <a href="https://github.com/apiforfun/theratesapi">GitHub</a>
      <a href="https://github.com/apiforfun/theratesapi/issues">Report an issue</a>
      <a href="/privacy-policy/"{% if active == 'privacy' %} aria-current="page"{% endif %}>Privacy</a>
      <a href="/terms-and-conditions/"{% if active == 'terms' %} aria-current="page"{% endif %}>Terms</a>
      <a href="mailto:apiforfun2@gmail.com">Contact</a>
    </nav>
  </div>
</footer>
</body>
</html>
